name: Build EduNova + NovAi (APK & AAB)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Capacitor & Generate Android Project
        run: |
          npm install
          npx cap add android
          npx cap sync android

      - name: Add Camera & Microphone Permissions for NovAi
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i 's/<uses-permission android:name="android.permission.INTERNET" \/>/<uses-permission android:name="android.permission.INTERNET" \/>
    <uses-permission android:name="android.permission.CAMERA" \/>
    <uses-permission android:name="android.permission.RECORD_AUDIO" \/>
    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" \/>/' $MANIFEST

      - name: Generate Release Keystore & Build Signed APK + AAB
        run: |
          cd android
          keytool -genkey -v -keystore app/edunova-release.keystore -alias edunova -keyalg RSA -keysize 2048 -validity 10000 -storepass edunova123 -keypass edunova123 -dname "CN=EduNova, OU=Education, O=EduNovaApp, L=Malaysia, S=Kelantan, C=MY"
          chmod +x gradlew
          ./gradlew assembleDebug
          ./gradlew assembleRelease
          ./gradlew bundleRelease
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 -keystore app/edunova-release.keystore -storepass edunova123 -keypass edunova123 app/build/outputs/apk/release/app-release-unsigned.apk edunova
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 -keystore app/edunova-release.keystore -storepass edunova123 -keypass edunova123 app/build/outputs/bundle/release/app-release.aab edunova
          mv app/build/outputs/apk/release/app-release-unsigned.apk app/build/outputs/apk/release/EduNova-NovAi-FullVersion.apk
          mv app/build/outputs/bundle/release/app-release.aab app/build/outputs/bundle/release/EduNova-NovAi-PlayStore.aab

      - name: Upload EduNova + NovAi APK
        uses: actions/upload-artifact@v4
        with:
          name: EduNova-NovAi-APK
          path: |
            android/app/build/outputs/apk/release/EduNova-NovAi-FullVersion.apk
            android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload EduNova + NovAi AAB (Google Play Store)
        uses: actions/upload-artifact@v4
        with:
          name: EduNova-NovAi-AAB
          path: |
            android/app/build/outputs/bundle/release/EduNova-NovAi-PlayStore.aab
            android/app/edunova-release.keystore
