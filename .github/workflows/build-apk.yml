name: Build EduNova + NovAi (APK & AAB)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Capacitor & Add Android Platform
        run: |
          npm install
          npx cap add android
          npx cap sync android

      - name: Configure Camera & Microphone Permissions Safely
        run: |
          python3 -c '
          import xml.etree.ElementTree as ET
          manifest_path = "android/app/src/main/AndroidManifest.xml"
          ET.register_namespace("android", "http://schemas.android.com/apk/res/android")
          tree = ET.parse(manifest_path)
          root = tree.getroot()
          ns = "{http://schemas.android.com/apk/res/android}"
          perms = [
              "android.permission.CAMERA",
              "android.permission.RECORD_AUDIO",
              "android.permission.MODIFY_AUDIO_SETTINGS"
          ]
          existing = {elem.attrib.get(ns + "name") for elem in root.findall("uses-permission")}
          for p in perms:
              if p not in existing:
                  el = ET.Element("uses-permission", {ns + "name": p})
                  root.insert(0, el)
          tree.write(manifest_path, encoding="utf-8", xml_declaration=True)
          '

      - name: Build & Sign Release APK + Play Store AAB
        run: |
          cd android
          keytool -genkey -v -keystore app/edunova-release.keystore -alias edunova -keyalg RSA -keysize 2048 -validity 10000 -storepass edunova123 -keypass edunova123 -dname "CN=EduNova, OU=Education, O=EduNovaApp, L=Malaysia, S=Kelantan, C=MY"
          chmod +x gradlew
          ./gradlew assembleDebug
          ./gradlew assembleRelease
          ./gradlew bundleRelease
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 -keystore app/edunova-release.keystore -storepass edunova123 -keypass edunova123 app/build/outputs/apk/release/app-release-unsigned.apk edunova
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 -keystore app/edunova-release.keystore -storepass edunova123 -keypass edunova123 app/build/outputs/bundle/release/app-release.aab edunova
          mv app/build/outputs/apk/release/app-release-unsigned.apk app/build/outputs/apk/release/EduNova-NovAi-FullVersion.apk
          mv app/build/outputs/bundle/release/app-release.aab app/build/outputs/bundle/release/EduNova-NovAi-PlayStore.aab

      - name: Upload EduNova + NovAi APK
        uses: actions/upload-artifact@v4
        with:
          name: EduNova-NovAi-APK
          path: |
            android/app/build/outputs/apk/release/EduNova-NovAi-FullVersion.apk
            android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload EduNova + NovAi AAB (Google Play Store)
        uses: actions/upload-artifact@v4
        with:
          name: EduNova-NovAi-AAB
          path: |
            android/app/build/outputs/bundle/release/EduNova-NovAi-PlayStore.aab
            android/app/edunova-release.keystore
